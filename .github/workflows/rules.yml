name: Weekly rules

on:
  push:
    branches: [main]
    paths-ignore:
      - "rules/generated/**"
      - "rules/reports/**"
      - "rules/health-state.json"
      - "rules/sources-lock.json"
      - "rules/version.txt"
  schedule:
    # Monday 03:37 US Pacific time; off the hourly GitHub Actions load peak.
    - cron: "37 3 * * 1"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weig-zeroad-rules-release
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        source: [anti-ad, 217heidai-lite, hagezi-light, stevenblack]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - name: Fetch and normalize ${{ matrix.source }}
        run: python -m rule_tools.fetch_source --source "${{ matrix.source }}"
      - name: Write source summary
        if: always()
        run: >-
          python -m rule_tools.github_summary
          --source "staging/source-meta/${{ matrix.source }}.json"
      - name: Upload source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ matrix.source }}
          path: |
            staging/sources/${{ matrix.source }}.domains
            staging/source-meta/${{ matrix.source }}.json
          if-no-files-found: warn
          retention-days: 3

  prepare:
    needs: [test, fetch]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v5
        with:
          pattern: source-*
          path: staging
          merge-multiple: true
      - name: Build raw profiles and 16 stable shards
        run: |
          python -m rule_tools.prepare --shards 16
          python -m rule_tools.github_summary --prepare staging/prepare-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: dns-shards
          path: staging/shards
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-data
          path: |
            staging/profiles
            staging/reward-ads.domains
            staging/cn-catalog.domains
            staging/prepare-summary.json
            staging/source-meta
          retention-days: 3

  dns:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Public resolvers throttle the 16 x 20 fan-out. Eight runners keep the
      # global query rate sustainable and generally finish sooner.
      max-parallel: 8
      matrix:
        shard: ["00", "01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14", "15"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v5
        with:
          name: dns-shards
          path: staging/shards
      - name: Check DNS shard ${{ matrix.shard }}
        run: |
          timeout --signal=INT --kill-after=30s 110m \
            python -m rule_tools.dns_check \
            --input "staging/shards/shard-${{ matrix.shard }}.domains" \
            --output "staging/health/shard-${{ matrix.shard }}.jsonl" \
            --summary "staging/health/shard-${{ matrix.shard }}.summary.json" \
            --concurrency 20 \
            --progress-seconds 30 \
            --progress-steps 20
      - name: Upload DNS results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-${{ matrix.shard }}
          path: |
            staging/health/shard-${{ matrix.shard }}.jsonl
            staging/health/shard-${{ matrix.shard }}.summary.json
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: dns
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v5
        with:
          name: prepared-data
          path: staging
      - uses: actions/download-artifact@v5
        with:
          pattern: health-*
          path: staging/health
          merge-multiple: true
      - name: Finalize profiles and verify invariants
        run: |
          RUN_DATE="$(TZ=Asia/Singapore date +%F)"
          python -m rule_tools.finalize --date "$RUN_DATE"
          python -m unittest discover -s tests -v
          python -m rule_tools.build_release
          python -m rule_tools.github_summary --release rules/generated/manifest.json
      - name: Commit auditable generated state
        run: |
          git config user.name "weig-zeroad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/generated rules/health-state.json rules/sources-lock.json rules/version.txt rules/reports
          git diff --cached --quiet || git commit -m "rules: weekly verified update"
          git push
      - name: Publish data-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat rules/version.txt)
          TAG="rules-$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/WeiG-ZeroAd-Rules.zip dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/WeiG-ZeroAd-Rules.zip dist/SHA256SUMS \
              --title "Rules $VERSION" \
              --notes "Automated regional, deduplicated and DNS-checked WeiG ZeroAd rules. Data only."
          fi

  diagnostics:
    needs: [test, fetch, prepare, dns, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write workflow result
        env:
          TEST_RESULT: ${{ needs.test.result }}
          FETCH_RESULT: ${{ needs.fetch.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          DNS_RESULT: ${{ needs.dns.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          echo "## Weekly rules workflow" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unit tests | $TEST_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fetch 4 sources | $FETCH_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Prepare 16 shards | $PREPARE_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| DNS checks | $DNS_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Publish | $PUBLISH_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Open a failed DNS matrix job for live progress. Download its health artifact for partial JSONL and the diagnostic summary." >> "$GITHUB_STEP_SUMMARY"
